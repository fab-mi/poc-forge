[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocforge"
version = "0.1.0"
description = "Plugin-based vulnerability verification CLI - for AUTHORIZED local ranges only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests"]
license = { text = "MIT" }

[project.scripts]
pocforge = "pocforge:main"

[tool.setuptools]
packages = ["core", "plugins"]
py-modules = ["pocforge"]
